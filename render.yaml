services:
  - type: web
    name: typeform-clone-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: typeform-clone-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/data/typeform.db
      - key: FRONTEND_ORIGIN
        sync: false
